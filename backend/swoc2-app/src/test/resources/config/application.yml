# Loaded IN ADDITION to src/main/resources/application.yml (classpath:/config/ has higher
# precedence). A test-classpath application.yml would instead shadow the main file completely,
# silently dropping every real setting from all tests.
# Test-only override. The main application.yml drives OAuth2 client registration from
# SWOC2_OIDC_ISSUER_URI via live discovery (a GET to {issuer}/.well-known/openid-configuration
# at startup) - correct for real environments, but it would make every test that boots the
# Spring context require a reachable Keycloak. Giving explicit endpoints instead of an
# issuer-uri here skips discovery entirely, so the context loads offline.
spring:
  security:
    oauth2:
      client:
        registration:
          swoc2:
            provider: swoc2
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          swoc2:
            authorization-uri: https://swoc2-test.invalid/realms/swoc2-dev/protocol/openid-connect/auth
            token-uri: https://swoc2-test.invalid/realms/swoc2-dev/protocol/openid-connect/token
            user-info-uri: https://swoc2-test.invalid/realms/swoc2-dev/protocol/openid-connect/userinfo
            jwk-set-uri: https://swoc2-test.invalid/realms/swoc2-dev/protocol/openid-connect/certs

swoc2:
  secret-key: test-only-secret-key
