# Base configuration. Every setting is overridable via environment variables
# (CLAUDE.md "Non-negotiable principles" #8; full list in ARCHITECTURE §12 and .env.example).
spring:
  application:
    name: swoc2
  security:
    oauth2:
      client:
        registration:
          swoc2:
            client-id: ${SWOC2_OIDC_CLIENT_ID:swoc2}
            client-secret: ${SWOC2_OIDC_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            scope: openid,profile,email
        provider:
          swoc2:
            # Browser-facing issuer (ARCHITECTURE §7). Must equal the token `iss` claim.
            # Set SWOC2_OIDC_BACKCHANNEL_URI instead when the backend reaches Keycloak at a
            # different internal address (e.g. the app runs in a container but Keycloak's
            # published URL is only reachable from the host/browser).
            issuer-uri: ${SWOC2_OIDC_BACKCHANNEL_URI:${SWOC2_OIDC_ISSUER_URI:}}

server:
  port: ${SWOC2_HTTP_PORT:5080}

swoc2:
  # Plugin host (ARCHITECTURE §8.2); lists are comma-separated plugin ids.
  plugins:
    call-timeout: ${SWOC2_PLUGINS_CALL_TIMEOUT:5s}
    max-consecutive-failures: ${SWOC2_PLUGINS_MAX_FAILURES:3}
    enabled: ${SWOC2_PLUGINS_ENABLED:}
    disabled: ${SWOC2_PLUGINS_DISABLED:}
  base-path: ${SWOC2_BASE_PATH:/}
  forwarded-headers: ${SWOC2_FORWARDED_HEADERS:true}
  oidc-issuer-uri: ${SWOC2_OIDC_ISSUER_URI:}

logging:
  level:
    root: ${SWOC2_LOG_LEVEL:INFO}
