# Dev support stack (CLAUDE.md "Dev stack" command): dev Keycloak with the test realm, and a
# Caddy instance for the sub-path reverse-proxy test (docs/TESTING.md §1.2/§3.3). The app itself
# is run separately (./backend/mvnw -pl swoc2-app spring-boot:run, or the Docker image) so it's
# easy to iterate on without rebuilding this stack.
#
#   docker compose -f deploy/compose/docker-compose.dev.yml up -d
#
# MediaMTX and the SEDAP test sender are added here when the features that need them land
# (VID-001 ff., P2; Spike C, ROADMAP P0 item 9).
#
# Explicit project `name` below: without it, Compose names the project (and so every container,
# e.g. `compose-keycloak-1`) after the directory it's run from - which was confusing in practice
# (a real incident: `docker rm -f <container someone guessed>` didn't touch the actual
# compose-managed container at all, because it wasn't named what anyone expected).
# `docker ps --filter name=swoc2` now actually finds these.
name: swoc2-dev
services:
  # PostgreSQL 18 + TimescaleDB + PostGIS (ADR 0012/0020). Same image as tests and production.
  db:
    image: timescale/timescaledb-ha:pg18.6-ts2.30.2
    environment:
      POSTGRES_USER: swoc2
      POSTGRES_PASSWORD: swoc2-dev
      POSTGRES_DB: swoc2
    ports:
      - "5082:5432"
    volumes:
      - db-data:/home/postgres/pgdata

  # MQTT broker for the SEDAP-Express MQTT transport (SDX-002). Anonymous, dev only.
  # Host port 5084 (1883 is taken by another service on Leon's VPS).
  mqtt:
    image: eclipse-mosquitto:2.1.2-alpine
    configs:
      - source: mosquitto
        target: /mosquitto/config/mosquitto.conf
    ports:
      - "5084:1883"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ../keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "5081:8080"

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
    ports:
      - "6443:6443" # sub-path proxy
      - "6445:6445" # same, WebSocket blocked
      - "6446:6446" # same, WebSocket and SSE blocked
    extra_hosts:
      # Lets Caddy reach the app on the host's own port, however it's being run (mvnw
      # spring-boot:run or `docker run -p 5080:5080`) - Linux needs this explicit mapping,
      # Docker Desktop provides it automatically but the mapping is harmless there too.
      - "host.docker.internal:host-gateway"

volumes:
  db-data:

configs:
  mosquitto:
    content: |
      listener 1883
      allow_anonymous true
